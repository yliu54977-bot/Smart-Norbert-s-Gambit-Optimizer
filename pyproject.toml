[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "norbert-gambit-optimizer"
version = "0.1.0"
description = "Compare a bank CAD-to-USD conversion with Norbert's Gambit on historical data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7", "yfinance>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
norbert-optimizer = "norbert_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
